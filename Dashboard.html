<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Double-U Tree</title>
</head>
<body>

    <!-- Account tab -->
    <div id="accountTab">
        <p>Account: <span id="accountUsername">Username</span></p>
    </div>

    <hr>

    <!-- Current course progress -->
    <div id="progressTab">
        <h2>Your Progress</h2>
        <p>Cdull 5/8 - Data Conversion</p>
        <p>You are almost done!</p>
        <progress value="5" max="8"></progress>
    </div>

    <hr>

    <!-- Other languages to learn -->
    <div id="otherLanguagesTab">
        <h2>Wanna Learn Other Languages?</h2>
        <ul>
            <li>C-</li>
            <li>Anaconda</li>
            <li>C--</li>
            <li>Shoestrap</li>
        </ul>
    </div>

</body>
</html>
