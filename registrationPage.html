<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register on Double-U Tree!</title>
    <link rel="stylesheet" href="style.css">
<style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
body {
        background-color: #1c1c26;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #400653;
        text-align: center;
        padding: 40px 20px;
    }

    header h1 {
        color: #a708dc;
        margin: 0 0 10px 0;
        font-size: 36px;
    }

    header h3 {
        color: rgba(8, 218, 26, 0.811);
        margin: 0;
        font-weight: normal;
        font-size: 16px;
    }

    .form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 60px 40px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #cccccc;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #444;
        background-color: #2a2a38;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        box-sizing: border-box;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: #a708dc;
    }

    </style>
</head>
