<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register on Double-U Tree!</title>
    <link rel="stylesheet" href="style.css">
<style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
body {
        background-color: #1c1c26;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #400653;
        text-align: center;
        padding: 40px 20px;
    }

    header h1 {
        color: #a708dc;
        margin: 0 0 10px 0;
        font-size: 36px;
    }

    header h3 {
        color: rgba(8, 218, 26, 0.811);
        margin: 0;
        font-weight: normal;
        font-size: 16px;
    }

    .form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 60px 40px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #cccccc;
    }

    input[type="text"], input[type="date"],
    input[type="password"], select {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #444;
        background-color: #2a2a38;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="password"]:focus,
    select:focus {
        outline: none;
        border-color: #a708dc;
    }
    input[type="date"] {
        color-scheme: dark;
    }

    .sex-options {
        display: flex;
        gap: 24px;
        margin-top: 4px;
    }

    .sex-options label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: white;
        font-size: 14px;
        margin-bottom: 0;
    }

    .sex-options input[type="radio"] {
        accent-color: #a708dc;
    }

    .enroll-btn {
        display: block;
        width: 100%;
        background-color: #a708dc;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    .enroll-btn:hover {
        background-color: #8a06b8;
    }

    .error-message {
        color: #ff6b6b;
        font-size: 13px;
        margin-top: -10px;
        margin-bottom: 20px;
        display: none;
    }

     .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 90px;
    }

    .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(8, 218, 26, 0.811);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        cursor: pointer;
        padding: 4px 6px;
    }

    .toggle-password:hover {
        color: #ffffff;
    }



    </style>
</head>
<body>

    <header>
        <h1>Hello Dear Future Student!</h1>
        <h3>Before we proceed on enrolling you, you must fill up the information required.</h3>
    </header>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

             <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob"  min= "1900-01-01" max="2026-12-31" required>
            </div>

            <div class="form-group">
                <label>Sex</label>
                <div class="sex-options">
                    <label for="sexMale">
                        <input type="radio" id="sexMale" name="sex" value="male" required>
                        Male
                    </label>
                    <label for="sexFemale">
                        <input type="radio" id="sexFemale" name="sex" value="female" required>
                        Female
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Re-enter Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">Show</button>
                </div>
            </div>

            <p class="error-message" id="errorMessage">Passwords do not match. Please try again.</p>

            <button type="submit" class="enroll-btn">Enroll/Register</button>
        </form>
    </div>
 <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }

        const form = document.querySelector('form');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorMessage.style.display = 'block';
                return;
            }

            errorMessage.style.display = 'none';
            submitBtn.disabled = true;

            const sexInput = document.querySelector('input[name="sex"]:checked');

            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                dateOfBirth: document.getElementById('dob').value,
                sex: sexInput ? sexInput.value : '',
                username: document.getElementById('username').value,
                password: password
            };

            try {
                const response = await fetch('https://localhost:7180/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = 'RegistrationComplete.html';
                } else {
                    const errorText = await response.text();
                    errorMessage.textContent = errorText;
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorMessage.textContent = 'Could not connect to server.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
