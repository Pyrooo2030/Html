<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In to Double-U Tree!</title>
    <link rel="stylesheet" href="style.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

    body {
        background-color: #1c1c26;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #400653;
        text-align: center;
        padding: 40px 20px;
    }

    header h1 {
        color: #a708dc;
        margin: 0 0 10px 0;
        font-size: 36px;
    }

    header h3 {
        color: rgba(8, 218, 26, 0.811);
        margin: 0;
        font-weight: normal;
        font-size: 16px;
    }

    .form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 60px 40px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #cccccc;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #444;
        background-color: #2a2a38;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        outline: none;
        border-color: #a708dc;
    }

    .enroll-btn {
        display: block;
        width: 100%;
        background-color: #a708dc;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    .enroll-btn:hover {
        background-color: #8a06b8;
    }

    .error-message {
        color: #ff6b6b;
        font-size: 13px;
        margin-top: -10px;
        margin-bottom: 20px;
        display: none;
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 90px;
    }

    .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(8, 218, 26, 0.811);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        cursor: pointer;
        padding: 4px 6px;
    }

    .toggle-password:hover {
        color: #ffffff;
    }

</style>
</head>
<body>

    <header>
        <h1>Welcome Back, Student!</h1>
        <h3>Log in with your username and password to continue.</h3>
    </header>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Show</button>
                </div>
            </div>

            <p class="error-message" id="errorMessage">Invalid username or password.</p>

            <button type="submit" class="enroll-btn">Log In</button>
        </form>
    </div>

    <script>
               function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }

        const form = document.querySelector('form');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('https://localhost:7180/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    errorMessage.style.display = 'none';
                    window.location.href = 'welcomePage.html';
                } else {
                    const errorText = await response.text();
                    errorMessage.textContent = errorText;
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.textContent = 'Could not connect to server.';
                errorMessage.style.display = 'block';
            }
        });
    </script>

</body>
</html>
